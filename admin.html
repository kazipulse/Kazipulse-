<!DOCTYPE html>
<html lang="en">
<head>

  <title>Kazipulse Admin Dashboard</title>

    }

      background: #111827;

    }

    .admin-badge {
      background: #16a34a;
      padding: 7px 12px;
      border-radius: 20px;

    }

    .container {

    }

      border-radius: 14px;
      margin-bottom: 20px;

    }

    .welcome h2 {
      margin-bottom: 8px;
    }

      gap: 15px;
      margin-bottom: 25px;
    }
