<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaziPulse - Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #151f32;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8c9;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #33415c;
      border-radius: 10px;
      background: #0d1627;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #4f8cff;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #aeb8c9;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    .error {
      color: #ff7777;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>KaziPulse</h1>

    <div class="subtitle">
      Login to your account
    </div>

    <form id="loginForm">

      <label for="login">Email or Phone Number</label>

      <input
        type="text"
        id="login"
        placeholder="Enter email or phone"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div class="error" id="errorMessage"></div>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>

  <script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const login = document.getElementById("login").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      const errorMessage = document.getElementById("errorMessage");

      errorMessage.style.display = "none";

      const savedUser = localStorage.getItem("kaziPulseUser");

      if (!savedUser) {
        errorMessage.textContent =
          "No account found. Please register first.";
        errorMessage.style.display = "block";
        return;
      }

      let user;

      try {
        user = JSON.parse(savedUser);
      } catch (error) {
        errorMessage.textContent =
          "Account data is corrupted. Please register again.";
        errorMessage.style.display = "block";
        return;
      }

      const emailMatch =
        user.email &&
        user.email.toLowerCase() === login;

      const phoneMatch =
        user.phone &&
        user.phone.toLowerCase() === login;

      if ((emailMatch || phoneMatch) && user.password === password) {

        localStorage.setItem("kaziPulseLoggedIn", "true");

        window.location.href = "dashboard.html";

      } else {

        errorMessage.textContent =
          "Incorrect email/phone or password.";

        errorMessage.style.display = "block";
      }

    });

  </script>

</body>
</html>
