<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - KaziPulse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #155eef;
      color: white;
      padding: 15px 20px;
    }

    .nav {
      max-width: 1150px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      font-weight: bold;
    }

    .logout {
      background: white;
      color: #155eef;
      border: none;
      padding: 8px 13px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #667085;
    }

    .verification {
      background: #fff7df;
      border-left: 5px solid #f0a500;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .balance {
      background: linear-gradient(135deg, #155eef, #6c5ce7);
      color: white;
      padding: 28px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .balance-label {
      opacity: 0.9;
      font-size: 14px;
    }

    .balance-amount {
      font-size: 38px;
      font-weight: bold;
      margin: 5px 0 15px;
    }
