<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaziPulse - Register</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      background: #151f32;
      padding: 25px;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aeb8c9;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #33415c;
      border-radius: 10px;
      background: #0d1627;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #4f8cff;
    }

    .fee {
      background: #0d1627;
      border-radius: 10px;
      padding: 14px;
      margin: 15px 0;
      line-height: 1.6;
    }

    .fee strong {
      font-size: 20px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .terms {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 18px;
      font-size: 13px;
      color: #c0c8d6;
    }

    .terms input {
      width: auto;
      margin-top: 2px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #aeb8c9;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    .notice {
      background: #17243a;
      border-left: 4px solid #2563eb;
      padding: 12px;
      margin-top: 15px;
      font-size: 13px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>KaziPulse</h1>

  <div class="subtitle">
    Create your account
  </div>

  <form id="registrationForm">

    <label>Full Name</label>
    <input
      type="text"
      id="fullName"
      placeholder="Enter your full name"
      required
    >

    <label>Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="07XXXXXXXX"
      required
    >

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Minimum 6 characters"
      required
    >

    <label>Referral Code (Optional)</label>
    <input
      type="text"
      id="referral"
      placeholder="Enter referral code"
    >

    <div class="fee">
      Registration Fee<br>
      <strong>KSh 120</strong><br>
      Payment Method: LOOP
    </div>

    <label>Payment Reference</label>
    <input
      type="text"
      id="paymentReference"
      placeholder="Enter payment reference"
    >

    <div class="notice">
      Your payment reference will be recorded for verification.
    </div>

    <div class="terms">
      <input type="checkbox" id="terms" required>
      <span>I agree to the KaziPulse terms and conditions.</span>
    </div>

    <button type="submit">
      Create Account
    </button>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>

document.getElementById("registrationForm").addEventListener("submit", function(event) {

  event.preventDefault();

  const fullName =
    document.getElementById("fullName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim().toLowerCase();

  const password =
    document.getElementById("password").value;

  const referral =
    document.getElementById("referral").value.trim();

  const paymentReference =
    document.getElementById("paymentReference").value.trim();

  if (!fullName || !phone || !email || !password) {
    alert("Please complete all required fields.");
    return;
  }

  if (password.length < 6) {
    alert("Password must contain at least 6 characters.");
    return;
  }

  if (!document.getElementById("terms").checked) {
    alert("Please accept the terms and conditions.");
    return;
  }

  /* Automatic registration number */
  const registrationNumber =
    "KZP-" + Math.floor(100000 + Math.random() * 900000);

  /* Automatic referral code */
  const referralCode =
    "KAZI" +
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  const user = {

    registrationNumber: registrationNumber,

    name: fullName,

    phone: phone,

    email: email,

    password: password,

    referralCode: referralCode,

    referredBy: referral || null,

    registrationFee: 120,

    paymentMethod: "LOOP",

    paymentReference: paymentReference || "Not provided",

    paymentStatus: paymentReference
      ? "Pending Verification"
      : "Payment Pending",

    wallet: {
      survey: 0,
      referral: 0,
      tournament: 0,
      total: 0
    },

    surveysCompleted: 0,

    referrals: 0,

    tournamentEntries: 0,

    createdAt: new Date().toISOString()

  };

  /* Save user */
  localStorage.setItem(
    "kaziPulseUser",
    JSON.stringify(user)
  );

  /* Log user in immediately */
  localStorage.setItem(
    "kaziPulseLoggedIn",
    "true"
  );

  alert(
    "Account created successfully!\n\n" +
    "Registration Number: " +
    registrationNumber
  );

  /* Go directly to dashboard */
  window.location.href = "dashboard.html";

});

</script>

</body>
</html>
