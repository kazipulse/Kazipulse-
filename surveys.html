<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaziPulse - Surveys</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #0b1220;
      color: white;
    }

    header {
      background: #151f32;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    header a {
      color: #60a5fa;
      text-decoration: none;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .intro {
      background: #151f32;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .survey {
      background: #151f32;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .survey h3 {
      margin-top: 0;
    }

    .reward {
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      background: #151f32;
      padding: 30px;
      border-radius: 15px;
      color: #aeb8c9;
    }

    .status {
      font-size: 13px;
      color: #aeb8c9;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<header>
  <h2>KaziPulse</h2>
  <a href="dashboard.html">Dashboard</a>
</header>

<div class="container">

  <div class="intro">
    <h2>Available Surveys</h2>
    <p class="status">
      Complete available surveys and receive the reward shown on each survey.
    </p>
  </div>

  <div id="surveyList"></div>

</div>

<script>

const userData = localStorage.getItem("kaziPulseUser");

if (!userData) {
  window.location.href = "login.html";
}

const user = JSON.parse(userData);

const surveyList = document.getElementById("surveyList");

const surveys =
  JSON.parse(localStorage.getItem("kazipulseSurveys")) || [];

const completedSurveys =
  JSON.parse(localStorage.getItem("kazipulseCompletedSurveys")) || [];

const userCompleted =
  completedSurveys.filter(
    item => item.userEmail === user.email
  );

if (surveys.length === 0) {

  surveyList.innerHTML = `
    <div class="empty">
      <h3>No surveys available</h3>
      <p>Please check again later.</p>
    </div>
  `;

} else {

  surveys.forEach((survey, index) => {

    const alreadyCompleted =
      userCompleted.some(
        item => String(item.surveyId) === String(survey.id)
      );

    const card = document.createElement("div");

    card.className = "survey";

    card.innerHTML = `
      <h3>${survey.title}</h3>

      <div class="reward">
        Reward: KSh ${Number(survey.reward || 0).toFixed(2)}
      </div>

      <div class="status">
        ${alreadyCompleted
          ? "✓ Completed"
          : "Available to complete"}
      </div>

      <br>

      <button
        ${alreadyCompleted ? "disabled" : ""}
        onclick="openSurvey(${index})">
        ${alreadyCompleted ? "Completed" : "Take Survey"}
      </button>
    `;

    surveyList.appendChild(card);

  });

}


function openSurvey(index) {

  localStorage.setItem(
    "selectedKazipulseSurvey",
    JSON.stringify(surveys[index])
  );

  window.location.href = "survey.html";

}

</script>

</body>
</html>
